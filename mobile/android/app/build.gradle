plugins { id 'com.android.application' }

android {
    namespace 'com.netvistastudio.editor.android'
    compileSdk 36
    defaultConfig {
        applicationId 'com.netvistastudio.editor.android'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '1.4.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        // The release workflow signs this exact unsigned APK with the maintained
        // mobile release key. No developer credentials belong in this project.
        release { minifyEnabled false }
    }
    lint { abortOnError true }
}

dependencies {
    def media3Version = '1.11.1'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-transformer:$media3Version"
    implementation "androidx.media3:media3-effect:$media3Version"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
