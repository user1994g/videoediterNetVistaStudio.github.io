name: Check native desktop workspace

on:
  push:
    paths:
      - 'cross_platform/**'
      - 'assets/home-video-coast.png'
      - '.github/workflows/check-native-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: cross_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cross_platform/requirements.txt
      - name: Install Linux native runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - run: python -m pip install -r requirements.txt
      - name: Test native widgets, editing and decoded export frames
        run: python -m unittest discover -s tests -v
      - name: Render native layout references
        if: always()
        run: python tests/workspace_preview.py workspace-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-desktop-layout-${{ runner.os }}
          path: cross_platform/workspace-qa/*.png
          if-no-files-found: error
          retention-days: 7
