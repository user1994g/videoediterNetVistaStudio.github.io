name: Release Windows and Linux apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft GitHub release tag to update
        required: true
        default: v1.4.0-beta.1
      version_label:
        description: Filename-safe version label
        required: true
        default: 1.4-Beta-1

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows app
            os: windows-latest
            script: powershell -ExecutionPolicy Bypass -File build_windows.ps1
            artifact: NetVista-Studio-Windows-Beta
          - name: Linux app
            os: ubuntu-24.04
            script: sh build_linux.sh
            artifact: NetVista-Studio-Linux-Beta
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cross_platform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cross_platform/requirements-build.txt
      - name: Install Linux multimedia libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Build and test exact release tag
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cross_platform/dist/NetVistaStudio
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish portable release assets
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      VERSION_LABEL: ${{ inputs.version_label }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: NetVista-Studio-*-Beta
          path: staging
      - name: Require an existing draft or prerelease
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's release-by-tag endpoint returns 404 for draft releases,
          # so find the matching tag in the authenticated releases list.
          RELEASE_STATE="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | [.tag_name, (.draft | tostring), (.prerelease | tostring)] | @tsv' |
              awk -F '\t' -v tag="$RELEASE_TAG" '$1 == tag { print $2 "\t" $3; exit }'
          )"
          if [[ -z "$RELEASE_STATE" ]]; then
            echo "Release $RELEASE_TAG does not exist." >&2
            exit 1
          fi
          IFS=$'\t' read -r IS_DRAFT IS_PRERELEASE <<< "$RELEASE_STATE"
          if [[ "$IS_DRAFT" != true && "$IS_PRERELEASE" != true ]]; then
            echo 'Portable beta assets may only be attached to a draft or prerelease.' >&2
            exit 1
          fi
      - name: Package complete application folders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mkdir -p package-windows/NetVistaStudio package-linux/NetVistaStudio
          cp -a staging/NetVista-Studio-Windows-Beta/. package-windows/NetVistaStudio/
          cp -a staging/NetVista-Studio-Linux-Beta/. package-linux/NetVistaStudio/
          (cd package-windows && zip -q -r "../dist/NetVista-Studio-Windows-$VERSION_LABEL.zip" NetVistaStudio)
          (cd package-linux && zip -q -r "../dist/NetVista-Studio-Linux-$VERSION_LABEL.zip" NetVistaStudio)
          unzip -t "dist/NetVista-Studio-Windows-$VERSION_LABEL.zip" >/dev/null
          unzip -t "dist/NetVista-Studio-Linux-$VERSION_LABEL.zip" >/dev/null
          sha256sum dist/*.zip
      - name: Replace Windows and Linux assets on release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "dist/NetVista-Studio-Windows-$VERSION_LABEL.zip#NetVista Studio for Windows — public beta" \
            "dist/NetVista-Studio-Linux-$VERSION_LABEL.zip#NetVista Studio for Linux — public beta" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
