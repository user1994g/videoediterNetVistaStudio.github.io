name: Check native Android editor

on:
  push:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        profile: [pixel_2, pixel_c]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: gradle --no-daemon -p mobile/android :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable acceleration in the disposable test runner
        run: sudo chmod a+rw /dev/kvm
      - name: Check native phone/tablet workspace and real edited exports
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        timeout-minutes: 25
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash mobile/android/check_device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-native-build-${{ matrix.profile }}
          path: |
            mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
            mobile/android/app/build/reports/
            mobile/android/app/build/ui-screenshots/
          retention-days: 7
